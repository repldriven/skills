# Polylith workspace config. Read by polylith-cli (`poetry poly` /
# `poly` commands). The namespace is the single shared top-level
# Python package every brick (component / base) lives under.
[tool.polylith]
namespace = "chart_supply_refresh"

[tool.polylith.structure]
theme = "loose"

[tool.polylith.test]
enabled = true
