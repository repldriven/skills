name: ci

on:
  pull_request:
  push:
    branches: [main]

# Skills repo is markdown-driven; no programmatic tests yet. This
# placeholder workflow exists so PR status checks have something to
# report. Replace with `tessl tile lint` once that's CI-friendly.
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm tile layout
        run: |
          test -d skills           || { echo "missing skills/ dir"; exit 1; }
          test -f tile.json        || { echo "missing tile.json"; exit 1; }
          for d in skills/*/; do
            test -f "$d/SKILL.md"  || { echo "missing $d/SKILL.md"; exit 1; }
          done
          echo "tile layout looks valid: $(ls -d skills/*/ | wc -l) skill(s)"
