[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chart-supply-refresh"
version = "0.1.0"
description = "Fork a Helm chart's transitive Dockerfiles onto current base OS images and generate a CI workflow to keep them fresh."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "kjothen" }]
dependencies = [
  "click>=8.1",
  "jinja2>=3.1",
  "ruamel.yaml>=0.18",
]

[project.scripts]
chart-supply-refresh = "chart_supply_refresh.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/chart_supply_refresh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
